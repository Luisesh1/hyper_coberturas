# Preflight preliminar ETH Options: consultas GET y estado agregado.
# No compra/vende, no genera órdenes, no cancela, no habilita trading real.
name: Options - preflight ETH (solo lectura)

on:
  workflow_dispatch:
    inputs:
      binance_user_id:
        description: 'ID interno de Hyper Coberturas (no Binance UID)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: options-pilot-preflight-readonly
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Preparar SSH con host verificado
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_SSH_KEY:-}" ] ||
             [ -z "${SERVER_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Configuración SSH verificada incompleta"
            exit 1
          fi
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          if ! ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::Host SSH no coincide con la huella fijada"
            exit 1
          fi

      - name: Comprobar piloto ETH en modo solo lectura
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BINANCE_USER_ID: ${{ inputs.binance_user_id }}
        run: |
          set -euo pipefail
          if ! [[ "${BINANCE_USER_ID:-}" =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::Se necesita ID interno entero positivo"
            exit 1
          fi
          if [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_HOST:-}" ] ||
             [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Configuración VPS incompleta"
            exit 1
          fi
          # Una sola línea remota: no deja que Docker consuma el heredoc de bash -s.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-preflight.js '$BINANCE_USER_ID'" \
            | tee "$RUNNER_TEMP/options-pilot-preflight.log"

          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/options-pilot-preflight.log" ||
             ! grep -Fxq 'pilot_technical_status=pass' "$RUNNER_TEMP/options-pilot-preflight.log" ||
             ! grep -Fxq 'pilot_liveFlagsOff=pass' "$RUNNER_TEMP/options-pilot-preflight.log" ||
             ! grep -Fxq 'pilot_isolatedAccount=pass' "$RUNNER_TEMP/options-pilot-preflight.log"; then
            echo "::error::Preflight incompleto, flags no seguros o evidencia técnica insuficiente"
            exit 1
          fi
          {
            echo '### Preflight ETH — solo lectura'
            echo '- Verificaciones técnicas sin órdenes: pass'
            echo '- Operativa real autorizada: NO'
            echo '- Contrato concreto, presupuesto, tarifas y consentimiento: pendientes'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Este preflight jamás autoriza trading real ni certifica fills."

      - name: Estimar mínimo desembolso ETH con liquidez (solo GET)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_USER" ] || [ -z "$SERVER_HOST" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::Falta configuración del servidor"
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-min-loss-quote.js" \
            | tee "$RUNNER_TEMP/options-pilot-min-loss.log"

          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/options-pilot-min-loss.log" ||
             ! { grep -Fxq 'pilot_min_loss_scan=pass' "$RUNNER_TEMP/options-pilot-min-loss.log" ||
                 grep -Fxq 'pilot_min_loss_scan=unverified' "$RUNNER_TEMP/options-pilot-min-loss.log"; } ||
             ! grep -Fxq 'pilot_effective_fees=unverified' "$RUNNER_TEMP/options-pilot-min-loss.log" ||
             ! grep -Fxq 'pilot_usd_conversion=unverified' "$RUNNER_TEMP/options-pilot-min-loss.log"; then
            echo "::error::Cotización incompleta o sin control de riesgos"
            exit 1
          fi
          if grep -Fxq 'pilot_min_loss_scan=unverified' "$RUNNER_TEMP/options-pilot-min-loss.log"; then
            echo "::warning::No hay un contrato mínimo de ETH con cotización, spread y libro aceptables: NO OPERAR"
          fi
          {
            echo '### Estimación conservadora de desembolso ETH'
            echo '- Pérdida máxima comunicada por el usuario: 100 USD; NO equivale automáticamente a USDT.'
            echo '- Filtro previo de lectura: máximo 20 USDT de prima estimada + margen de comisión de entrada.'
            echo '- Si no hay un contrato líquido a ese importe: NO OPERAR.'
            echo '- Tipo permitido para futura propuesta: solamente compra de opción; nunca naked short.'
            echo '- Cotización actual, tarifa efectiva, USD/USDT y autorización: PENDIENTES.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::La opción de menor precio puede vencer sin valor; esto no constituye una recomendación ni habilita el piloto real."

      - name: Revisar contratos ETH con griegas y profundidad (solo mercado público)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_USER" ] || [ -z "$SERVER_HOST" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::Falta configuración VPS"
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-eth-contract-public-review.js" \
            | tee "$RUNNER_TEMP/options-eth-public-review.log"
          if ! grep -Fxq 'review_read_only=pass' "$RUNNER_TEMP/options-eth-public-review.log" ||
             ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/options-eth-public-review.log" ||
             ! { grep -Fxq 'review_status=candidates' "$RUNNER_TEMP/options-eth-public-review.log" ||
                 grep -Fxq 'review_status=no_candidate' "$RUNNER_TEMP/options-eth-public-review.log"; } ||
             ! grep -Fxq 'review_effective_fees=unverified' "$RUNNER_TEMP/options-eth-public-review.log"; then
            echo "::error::Revisión de contratos no completada de forma segura"
            exit 1
          fi
          if grep -Fxq 'review_status=no_candidate' "$RUNNER_TEMP/options-eth-public-review.log"; then
            echo "::warning::No se identificó ningún contrato ETH con delta y liquidez aceptables dentro de 20 USDT. NO OPERAR."
          fi
          {
            echo '### Revisión ETH: delta, precio y vencimiento'
            echo '- Todos los datos mostrados en logs son mercado PÚBLICO, no cuenta.'
            echo '- Filtrado: delta absoluta 0.25–0.75; vencimiento 3–30 días; spread <=10%.'
            echo '- Lote mínimo y coste teórico <=20 USDT incluyendo techo estimado de comisión de entrada.'
            echo '- Hasta tres contratos, entre un máximo de 12 libros inspeccionados.'
            echo '- Delta NO es probabilidad de éxito. Una prima barata puede perderse íntegramente.'
            echo '- Operación autorizada: NO; trading automático: NO.'
          } >> "$GITHUB_STEP_SUMMARY"
