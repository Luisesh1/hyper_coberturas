name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

env:
  # Dominio publico de produccion (no es secreto: ya figura en DEPLOYMENT.md).
  # SERVER_HOST es la IP (usada para SSH); el health check necesita el
  # dominio para que nginx resuelva el vhost/TLS correcto por SNI.
  PROD_DOMAIN: hypercover.luisesh1.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Resolver commit a desplegar
        id: target
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Configurar SSH con huella de host previamente verificada
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_SSH_KEY:-}" ] || [ -z "${SERVER_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Falta configuración SSH o SERVER_SSH_KNOWN_HOSTS verificado"
            exit 1
          fi
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          if ! ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::La huella SSH fijada no corresponde a SERVER_HOST"
            exit 1
          fi

      - name: Preflight VPS - bloquear deploy si trading real esta habilitado
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_HOST:-}" ] || [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Falta configuración de despliegue"
            exit 1
          fi
          # Solo lectura: validar el contenedor actual ANTES de modificarlo.
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node -e 'if (process.env.OPTIONS_LIVE_TRADING_ENABLED === \"true\" || process.env.OPTIONS_LIVE_PRODUCTION_APPROVED === \"true\") process.exit(3)'"; then
            echo "::error::Trading real activo o preflight remoto inaccesible; no desplegar"
            exit 1
          fi
          echo "options_predeploy_gate=pass"

      - name: Deploy por SSH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            set -e
            cd '$DEPLOY_PATH'
            git fetch origin main
            git checkout '$TARGET_SHA'
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T server npm run migrate
          "

      - name: Verificar release desplegado y ambos flags apagados
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && test \"\$(git rev-parse HEAD)\" = '$TARGET_SHA' && docker compose -f docker-compose.prod.yml exec -T server node -e 'const fs = require(\"node:fs\"); if (process.env.OPTIONS_LIVE_TRADING_ENABLED !== \"false\" || process.env.OPTIONS_LIVE_PRODUCTION_APPROVED !== \"false\" || !fs.existsSync(\"src/scripts/options-live-contract-check.js\") || !fs.existsSync(\"src/scripts/options-live-audit.js\")) process.exit(2)'"
          echo "options_deployed_read_only=pass"

      - name: Verificar health endpoint
        env:
          SERVER_IP: ${{ secrets.SERVER_HOST }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --resolve "$PROD_DOMAIN:443:$SERVER_IP" "https://$PROD_DOMAIN/api/health"; then
              echo "Health check OK"
              exit 0
            fi
            echo "Intento $i fallido, reintentando en 5s..."
            sleep 5
          done
          echo "Health check fallo tras el deploy"
          exit 1

      - name: Preparar UNA vez el piloto ETH pausado y límites de 1 USDT (sin trading)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Este cambio de configuración fue autorizado explícitamente.
          # Solo actuar en el commit de merge de la PR #16; en cualquier
          # despliegue posterior, incluso manual, omitir la mutación.
          expected='Merge PR #16: prepare paused ETH pilot with 1 USDT risk limits (live OFF)'
          subject="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && git log -1 --pretty=%s")"
          if [ "$subject" != "$expected" ]; then
            echo 'pilot_setup=skipped_other_release'
            exit 0
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-configure-paused.js --apply-paused-only" \
            | tee "$RUNNER_TEMP/pilot-setup.log"
          for required in \
            'pilot_setup_status=prepared_paused' \
            'pilot_setup_strategy_mode=paused' \
            'pilot_setup_global_risk=pass' \
            'pilot_setup_orders_sent=0' \
            'pilot_setup_live_enabled=no' \
            'pilot_ready=no'; do
            if ! grep -Fxq "$required" "$RUNNER_TEMP/pilot-setup.log"; then
              echo "::error::La configuración de piloto no completó todas sus comprobaciones"
              exit 1
            fi
          done
          {
            echo '### Configuración autorizada del piloto ETH'
            echo '- Estrategia nueva PAUSADA, sin alertas y sin órdenes.'
            echo '- Límites globales y por estrategia reducidos a 1 USDT.'
            echo '- Otras estrategias conservadas, sin activar trading real.'
            echo '- Esta acción está limitada al merge específico de la PR #16.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revisar opciones ETH públicas tras el deploy (informativo, sin órdenes)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Falla como aviso, no bloquea la salud del deploy por latencia
          # de un proveedor externo de market data.
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-eth-contract-public-review.js" \
            >"$RUNNER_TEMP/options-eth-public-review.log" 2>/dev/null; then
            echo "::warning::Mercado público ETH no disponible: NO OPERAR"
            exit 0
          fi
          if ! grep -Fxq 'review_read_only=pass' "$RUNNER_TEMP/options-eth-public-review.log" ||
             ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/options-eth-public-review.log"; then
            echo "::warning::Revisión pública ETH incompleta: NO OPERAR"
            exit 0
          fi
          # Datos exclusivamente públicos de contrato, precio y griegas.
          grep -E '^review_(status|eth_index_usdt|snapshot_at|books_sampled|candidate_[123]_)' \
            "$RUNNER_TEMP/options-eth-public-review.log" || true
          {
            echo '### Revisión pública ETH tras deploy (no autoriza ninguna orden)'
            if grep -Fxq 'review_status=candidates' "$RUNNER_TEMP/options-eth-public-review.log"; then
              echo '- Hay candidatos preliminares. Confirmar liquidez y precio nuevamente antes de operar.'
            else
              echo '- Sin candidatos bajo restricciones actuales: NO OPERAR.'
            fi
            echo '- Máxima pérdida declarada: 100 USD; criba inicial <=20 USDT.'
            echo '- getOrder/userTrades siguen pendientes de prueba real autorizada.'
            echo '- Permiso de una sola orden y activación live: NO CONCEDIDOS.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar BUY ETH exacto y fondos disponibles (solo GET, sin órdenes)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Petición de preparación, NO consentimiento para ejecutar.
          # Se evalúa el contrato del último análisis, en la cuenta interna
          # ya diagnosticada. Nunca se envía una orden.
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-exact-buy-readonly-preview.js 1 ETH-261023-2500-C 0.01 23.60" \
            >"$RUNNER_TEMP/options-exact-buy-preview.log" 2>/dev/null; then
            echo "::warning::Vista previa firmada no disponible; NO OPERAR"
            exit 0
          fi
          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/options-exact-buy-preview.log" ||
             ! { grep -Fxq 'preview_status=pass' "$RUNNER_TEMP/options-exact-buy-preview.log" ||
                 grep -Fxq 'preview_status=blocked' "$RUNNER_TEMP/options-exact-buy-preview.log" ||
                 grep -Fxq 'preview_status=unverified' "$RUNNER_TEMP/options-exact-buy-preview.log"; }; then
            echo "::warning::Vista previa incompleta o malformada; NO OPERAR"
            exit 0
          fi
          # No exponer datos de cuenta, ni siquiera saldos. El script solo
          # emite precios PUBLICOS y booleans de las comprobaciones privadas.
          grep -E '^preview_(status|symbol|side|quantity|limit_usdt|bid_usdt|ask_usdt|market_reason|entry_total_cap_usdt|flagsOff|listed|marketQuotePresent|priceWithinLimit|quoteValid|exactFilters|bookFresh|liquidity|balanceKnown|balanceEnough|permissions|isolated)=' \
            "$RUNNER_TEMP/options-exact-buy-preview.log" || true
          if grep -Fxq 'preview_status=pass' "$RUNNER_TEMP/options-exact-buy-preview.log"; then
            echo "::warning::Preflight preliminar favorable: SIN autorización de trading ni estrategia; NO OPERAR."
          else
            echo "::warning::Preflight bloqueado o sin datos suficientes: NO OPERAR."
          fi
          {
            echo '### Vista previa de una compra ETH (datos privados minimizados)'
            echo '- Solo se comprueba una propuesta HISTÓRICA: 0.01 ETH-261023-2500-C, precio LIMIT <=23.60 USDT.'
            echo '- Si el ask actual supera el límite, se informa ask_above_limit. No subir precio automáticamente ni habilitar trading.'
            echo '- El libro debe tener timestamp fresco y volumen completo dentro del límite; una vista previa favorable no es permiso de orden.'
            echo '- No se muestra patrimonio ni saldo, únicamente estado suficiente/insuficiente/desconocido.'
            echo '- Las tarifas efectivas, autorización personal y estrategia siguen pendientes.'
            echo '- Trading real: OFF. No se enviaron órdenes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revisar estrategia y límites del piloto ETH (solo lectura)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-strategy-readiness.js" \
            >"$RUNNER_TEMP/options-pilot-strategy.log" 2>/dev/null; then
            echo "::warning::No se pudo validar la estrategia del piloto; NO OPERAR"
            exit 0
          fi
          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/options-pilot-strategy.log" ||
             ! { grep -Fxq 'strategy_preview_status=strategy_candidate' "$RUNNER_TEMP/options-pilot-strategy.log" ||
                 grep -Fxq 'strategy_preview_status=strategy_not_ready' "$RUNNER_TEMP/options-pilot-strategy.log"; }; then
            echo "::warning::Estado desconocido de estrategia; NO OPERAR"
            exit 0
          fi
          grep -E '^strategy_preview_(status|count|noActiveLiveStrategies|noLivePositions|globalRiskRestricted|exactStrategyAvailable|candidate_id|exact_contract_generated|execution_approved)=' \
            "$RUNNER_TEMP/options-pilot-strategy.log" || true
          if grep -Fxq 'strategy_preview_status=strategy_not_ready' "$RUNNER_TEMP/options-pilot-strategy.log"; then
            echo "::warning::Falta estrategia única y/o límites globales de pérdida comprobables: NO OPERAR"
          else
            echo "::warning::Estrategia preliminar encontrada; contrato exacto y orden real siguen SIN aprobarse"
          fi
          {
            echo '### Estrategia piloto ETH: solo lectura'
            echo '- No se creó, habilitó o modificó ningún bot.'
            echo '- Inspección: una sola estrategia BUY pausada/sombra, límites estrictos, posiciones y bots existentes.'
            echo '- Los límites globales por defecto exceden el techo conservador y deben revisarse.'
            echo '- Los stops y TP no garantizan precio de salida ni evitan perder la prima.'
            echo '- La autorización de una orden no equivale a autorización de trading automático.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Muestrear ejecuciones publicas de ETH GTC tras deploy (solo GET)
        if: github.event_name == 'workflow_run'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Reporte informativo cada deploy: filtros y trades publicos. Nunca opera.
          # No abre ni cancela ordenes, no cambia flags ni escribe en PostgreSQL.
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-gtc-dust-readonly.js ETH-261023-2500-C" \
            > "$RUNNER_TEMP/gtc-dust-once.log" 2>/dev/null; then
            echo '::warning::Binance GTC dust GET no disponible o bloqueado: NO OPERAR'
            exit 0
          fi
          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/gtc-dust-once.log"; then
            echo '::warning::Resultado de GTC incompleto: NO OPERAR'
            exit 0
          fi
          grep -E '^(gtc_dust_|pilot_ready=)' "$RUNNER_TEMP/gtc-dust-once.log" || true
          {
            echo '### Diagnostico GTC Binance tras deploy (solo lectura)'
            grep -E '^(gtc_dust_|pilot_ready=)' "$RUNNER_TEMP/gtc-dust-once.log" || true
            echo
            echo '**NO-GO:** el filtro de nuevo SELL no demuestra que Binance cierre una orden GTC con fill parcial.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar elegibilidad de señal ETH y canal Telegram
        if: github.event_name == 'workflow_run'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Solo el deploy de este cambio autorizado envia un mensaje de
          # prueba de Telegram. Cualquier otro deploy hace solo lectura.
          subject="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && git log -1 --pretty=%s")"
          mode='--read-only'
          if [ "$subject" = 'ops(options): deploy pilot channel verification' ]; then
            mode='--send-test'
          fi
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-channel-probe.js '$mode'" \
            >"$RUNNER_TEMP/pilot-channel-probe.log" 2>/dev/null; then
            echo '::warning::Diagnostico de canal no disponible; NO OPERAR'
            exit 0
          fi
          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/pilot-channel-probe.log" ||
             ! grep -Fxq 'pilot_channel_orders_sent=0' "$RUNNER_TEMP/pilot-channel-probe.log" ||
             ! grep -Eq '^pilot_channel_status=(channel_candidate|blocked)$' "$RUNNER_TEMP/pilot-channel-probe.log"; then
            echo '::warning::Reporte de canal incompleto; NO OPERAR'
            exit 0
          fi
          grep -E '^(pilot_channel_|pilot_ready=)' "$RUNNER_TEMP/pilot-channel-probe.log"
          {
            echo '### Señal ETH y Telegram: prueba controlada (NO habilita trading)'
            grep -E '^(pilot_channel_|pilot_ready=)' "$RUNNER_TEMP/pilot-channel-probe.log"
            echo
            echo '- Un ACK de Telegram NO prueba recepción humana.'
            echo '- Ninguna orden se envio a Binance. La estrategia permanece pausada.'
            echo '- No se imprime identidad del usuario, secretos, saldo ni nombres de sus alertas.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vincular unica alerta ETH valida al piloto PAUSADO (solo en esta liberacion)
        if: github.event_name == 'workflow_run'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          subject="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && git log -1 --pretty=%s")"
          # No reconfigurar estrategias en liberaciones distintas de esta.
          if [ "$subject" != 'ops(options): bind paused pilot ETH alert' ]; then
            echo 'pilot_alert_binding=skipped_other_release'
            exit 0
          fi
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-bind-single-alert.js --bind-paused-only" \
            >"$RUNNER_TEMP/pilot-bind.log" 2>/dev/null; then
            echo '::warning::No se pudo vincular la alerta al piloto; trading sigue OFF'
            exit 0
          fi
          if ! grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/pilot-bind.log" ||
             ! grep -Fxq 'pilot_alert_binding_orders_sent=0' "$RUNNER_TEMP/pilot-bind.log" ||
             ! grep -Fxq 'pilot_alert_binding_strategy_mode=paused' "$RUNNER_TEMP/pilot-bind.log" ||
             ! grep -Eq '^pilot_alert_binding_status=(bound|already_bound|blocked)$' "$RUNNER_TEMP/pilot-bind.log"; then
            echo '::warning::Respuesta de vinculacion no segura; NO OPERAR'
            exit 0
          fi
          grep -E '^(pilot_alert_binding_|pilot_ready=)' "$RUNNER_TEMP/pilot-bind.log"
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-channel-probe.js --read-only" \
            >"$RUNNER_TEMP/pilot-bind-verify.log" 2>/dev/null; then
            echo '::warning::No se pudo verificar la alerta vinculada; NO OPERAR'
            exit 0
          fi
          grep -E '^(pilot_channel_|pilot_ready=)' "$RUNNER_TEMP/pilot-bind-verify.log" || true
          {
            echo '### Vinculacion limitada del piloto ETH'
            grep -E '^(pilot_alert_binding_|pilot_ready=)' "$RUNNER_TEMP/pilot-bind.log"
            grep -E '^(pilot_channel_|pilot_ready=)' "$RUNNER_TEMP/pilot-bind-verify.log" || true
            echo
            echo 'El bot sigue PAUSADO, con trading real OFF y sin ordenes enviadas.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Crear senal ETH 7-14 dias exclusiva y vincular al piloto PAUSADO
        if: github.event_name == 'workflow_run'
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # La unica autorizacion de escritura aplica a este commit y a
          # crear una COPIA de la alerta. No activar modo live ni Binance POST.
          subject="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && git log -1 --pretty=%s")"
          # Este diagnostico no modifica datos y se ejecuta en CADA deploy.
          # La creacion queda protegida por el asunto exacto del commit.
          # Solo lectura: detecta ajustes previos sin revelar valores
          # del usuario ni restaurar una configuracion modificada.
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-alert-diagnose-readonly.js --read-only" \
            >"$RUNNER_TEMP/pilot-dedicated-diff.log" 2>/dev/null; then
            echo '::error::No fue posible inspeccionar la estrategia en solo lectura'
            exit 1
          fi
          grep -Fxq 'pilot_alert_diag_read_only=yes' "$RUNNER_TEMP/pilot-dedicated-diff.log" || exit 1
          grep -Fxq 'pilot_alert_diag_orders_sent=0' "$RUNNER_TEMP/pilot-dedicated-diff.log" || exit 1
          grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/pilot-dedicated-diff.log" || exit 1
          grep -E '^(pilot_alert_diag_|pilot_ready=)' "$RUNNER_TEMP/pilot-dedicated-diff.log"
          {
            echo '### Diagnostico de la estrategia piloto, solo lectura'
            grep -E '^(pilot_alert_diag_|pilot_ready=)' "$RUNNER_TEMP/pilot-dedicated-diff.log"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$subject" != 'ops(options): clone dedicated ETH 7-14 pilot alert' ]; then
            echo 'pilot_dedicated_alert=skipped_other_release'
            exit 0
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-create-dedicated-alert.js --create-paused-only" \
            >"$RUNNER_TEMP/pilot-exclusive-alert.log" 2>/dev/null || {
              echo "::error::No se pudo configurar alerta exclusiva; NO OPERAR"
              exit 1
            }
          for required in \
            'pilot_dedicated_alert_expiry=7_14' \
            'pilot_dedicated_alert_source_untouched=yes' \
            'pilot_dedicated_alert_telegram_duplication=off' \
            'pilot_dedicated_alert_strategy_mode=paused' \
            'pilot_dedicated_alert_orders_sent=0' \
            'pilot_dedicated_alert_trading_enabled=no' \
            'pilot_ready=no'; do
            grep -Fxq "$required" "$RUNNER_TEMP/pilot-exclusive-alert.log" || {
              grep -E '^pilot_dedicated_alert_(status|reason)=' "$RUNNER_TEMP/pilot-exclusive-alert.log" || true
              echo "::error::Poscondicion incompleta en alerta piloto; no hubo ordenes"
              exit 1
            }
          done
          grep -Eq '^pilot_dedicated_alert_status=(created_and_bound|already_bound)$' \
            "$RUNNER_TEMP/pilot-exclusive-alert.log" || {
              grep -E '^pilot_dedicated_alert_(status|reason)=' \
                "$RUNNER_TEMP/pilot-exclusive-alert.log" || true
              echo "::error::La alerta exclusiva sigue bloqueada; NO OPERAR"
              exit 1
            }
          grep -E '^(pilot_dedicated_alert_|pilot_ready=)' "$RUNNER_TEMP/pilot-exclusive-alert.log"

          # Verificacion por segunda transaccion independiente, sin mutaciones.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-create-dedicated-alert.js --verify-only" \
            >"$RUNNER_TEMP/pilot-exclusive-verify.log" 2>/dev/null || {
              echo "::error::Verificacion independiente fallida"
              exit 1
            }
          grep -Fxq 'pilot_dedicated_alert_status=verified' \
            "$RUNNER_TEMP/pilot-exclusive-verify.log" || exit 1
          grep -Fxq 'pilot_ready=no' "$RUNNER_TEMP/pilot-exclusive-verify.log" || exit 1
          grep -E '^(pilot_dedicated_alert_|pilot_ready=)' "$RUNNER_TEMP/pilot-exclusive-verify.log"

          # Confirmar ahora que la estrategia escucha la COPIA, no la original.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.prod.yml exec -T server node src/scripts/options-pilot-channel-probe.js --read-only" \
            >"$RUNNER_TEMP/pilot-exclusive-channel.log" 2>/dev/null || exit 1
          for required in \
            'pilot_channel_status=channel_candidate' \
            'pilot_channel_signalBound=pass' \
            'pilot_channel_telegramConfigured=pass' \
            'pilot_channel_orders_sent=0' \
            'pilot_ready=no'; do
            grep -Fxq "$required" "$RUNNER_TEMP/pilot-exclusive-channel.log" || exit 1
          done
          {
            echo '### Alerta exclusiva del piloto ETH'
            grep -E '^(pilot_dedicated_alert_|pilot_ready=)' "$RUNNER_TEMP/pilot-exclusive-verify.log"
            grep -E '^(pilot_channel_(status|signalBound|telegramConfigured|orders_sent)=)' \
              "$RUNNER_TEMP/pilot-exclusive-channel.log"
            echo
            echo 'La alerta original no se modifico; bot PAUSADO; Binance no recibio ordenes.'
          } >> "$GITHUB_STEP_SUMMARY"

