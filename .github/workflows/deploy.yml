name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

env:
  # Dominio publico de produccion (no es secreto: ya figura en DEPLOYMENT.md).
  # SERVER_HOST es la IP (usada para SSH); el health check necesita el
  # dominio para que nginx resuelva el vhost/TLS correcto por SNI.
  PROD_DOMAIN: hypercover.luisesh1.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Resolver commit a desplegar
        id: target
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Configurar SSH con huella de host previamente verificada
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_SSH_KEY:-}" ] || [ -z "${SERVER_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Falta configuración SSH o SERVER_SSH_KNOWN_HOSTS verificado"
            exit 1
          fi
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          if ! ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::La huella SSH fijada no corresponde a SERVER_HOST"
            exit 1
          fi

      - name: Deploy por SSH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            set -e
            cd '$DEPLOY_PATH'
            git fetch origin main
            git checkout '$TARGET_SHA'
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T server npm run migrate
          "

      - name: Verificar health endpoint
        env:
          SERVER_IP: ${{ secrets.SERVER_HOST }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --resolve "$PROD_DOMAIN:443:$SERVER_IP" "https://$PROD_DOMAIN/api/health"; then
              echo "Health check OK"
              exit 0
            fi
            echo "Intento $i fallido, reintentando en 5s..."
            sleep 5
          done
          echo "Health check fallo tras el deploy"
          exit 1
