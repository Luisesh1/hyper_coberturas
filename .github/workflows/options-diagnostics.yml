# Diagnóstico de solo lectura (nunca envía/cancela órdenes).
# Se programa cada cinco horas UTC desde main una vez integrado.
# Requiere host SSH fijado en secret SERVER_SSH_KNOWN_HOSTS,
# obtenido de un canal confiable; nunca ssh-keyscan dentro de CI.
name: Options - diagnóstico VPS

on:
  workflow_dispatch:
    inputs:
      binance_user_id:
        description: 'ID interno de usuario para comprobar Binance (opcional, solo lectura)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 */5 * * *'

permissions:
  contents: read

concurrency:
  group: options-diagnostics-production
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Preparar SSH con host verificado
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_SSH_KEY:-}" ] || [ -z "${SERVER_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Falta SERVER_HOST, SERVER_SSH_KEY o SERVER_SSH_KNOWN_HOSTS (host SSH verificado)"
            exit 1
          fi
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          if ! ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::La huella SSH fijada no corresponde a SERVER_HOST"
            exit 1
          fi

      - name: Salud Docker y auditoría agregada
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_USER:-}" ] || [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Faltan SERVER_USER o DEPLOY_PATH"
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          set -euo pipefail
          compose=(docker compose -f docker-compose.prod.yml)

          healthy=1
          for service in server postgres nginx; do
            id="$("${compose[@]}" ps -q "$service")"
            if [ -z "$id" ]; then
              echo "service_$service=not_running"
              healthy=0
              continue
            fi
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")"
            echo "service_$service=$status"
            if [ "$status" != "healthy" ]; then healthy=0; fi
          done

          # Captura el JSON dentro del VPS y solo publica contadores; jamás
          # vuelca IDs, símbolos, posiciones ni credenciales a GitHub Actions.
          audit_status=0
          audit_output="$("${compose[@]}" exec -T server node src/scripts/options-live-audit.js 2>/dev/null)" || audit_status=$?
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 2 ]; then
            echo "options_audit=unavailable"
            exit 1
          fi
          printf '%s' "$audit_output" | "${compose[@]}" exec -T server node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              try {
                const d = JSON.parse(raw);
                const orders = Array.isArray(d.unresolved) ? d.unresolved : null;
                const expired = Array.isArray(d.expiredLocalLivePositions) ? d.expiredLocalLivePositions : null;
                const statuses = Array.isArray(d.orderStatuses) ? d.orderStatuses : null;
                if (!orders || !expired || !statuses) throw new Error("invalid shape");
                const unresolvedTotal = statuses.filter(s => s.status !== "final")
                  .reduce((acc, s) => acc + Number(s.count || 0), 0);
                const attention = orders.filter(o => o.status === "attention").length;
                const overdue = orders.filter(o => o.minutesPastDeadline > 1).length;
                console.log("options_unresolved_orders=" + unresolvedTotal);
                console.log("options_attention_orders=" + attention);
                console.log("options_overdue_orders=" + overdue);
                console.log("options_expired_positions=" + expired.length);
                if (unresolvedTotal > orders.length || attention || overdue || expired.length) {
                  process.exitCode = 2;
                }
              } catch (_) {
                console.log("options_audit=invalid_response");
                process.exitCode = 1;
              }
            });
          '
          if [ "$healthy" -ne 1 ]; then exit 2; fi
          REMOTE

      - name: Comprobar Binance Options firmadas (solo lectura; manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.binance_user_id != '' }}
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BINANCE_USER_ID: ${{ inputs.binance_user_id }}
        run: |
          set -euo pipefail
          if ! [[ "${BINANCE_USER_ID:-}" =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::binance_user_id debe ser un entero positivo"
            exit 1
          fi
          if [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_HOST:-}" ] || [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Falta configuración SSH/deploy en el entorno production"
            exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && bash -s -- '$BINANCE_USER_ID'" <<'REMOTE'
          set -euo pipefail
          user_id="$1"
          compose=(docker compose -f docker-compose.prod.yml)
          # No activar flags. Si alguno está activo, abortar incluso el preflight.
          if ! "${compose[@]}" exec -T server node -e '
            if (process.env.OPTIONS_LIVE_TRADING_ENABLED === "true" ||
                process.env.OPTIONS_LIVE_PRODUCTION_APPROVED === "true") process.exit(3);
          '; then
            echo "binance_contract_check=blocked_live_flag"
            exit 3
          fi
          # No hacer checkout del PR ni reconstruir contenedores en producción.
          # El diagnóstico solo corre si el release desplegado ya lo contiene.
          if ! "${compose[@]}" exec -T server node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("src/scripts/options-live-contract-check.js")) process.exit(2);
          '; then
            echo "binance_contract_check=not_deployed"
            exit 2
          fi
          status=0
          raw="$("${compose[@]}" exec -T server node src/scripts/options-live-contract-check.js "$user_id" 2>/dev/null)" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "binance_contract_check=unavailable"
            exit 1
          fi
          # Solo publicar el nombre/status/código de cada control; NUNCA el JSON.
          printf '%s' "$raw" | "${compose[@]}" exec -T server node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", part => { input += part; });
            process.stdin.on("end", () => {
              try {
                const result = JSON.parse(input);
                const allowed = new Set([
                  "exchangeInfo", "optionFilters", "spotKlines1h", "apiPermissions",
                  "marginAccount", "positions", "openOrders", "isolatedAccount",
                  "exerciseRecord", "bill", "getOrder", "userTrades"
                ]);
                if (result.readOnly !== true || !Array.isArray(result.results) ||
                    result.results.some(r => !allowed.has(r.endpoint) ||
                      (r.ok !== true && r.ok !== false && r.ok !== null))) {
                  throw new Error("Invalid contract response");
                }
                for (const row of result.results) {
                  console.log("binance_" + row.endpoint + "=" +
                    (row.ok === true ? "pass" : row.ok === null ? "unverified" : "fail"));
                }
                console.log("binance_contract_ready=" + (result.ready === true ? "yes" : "no"));
                if (result.ready !== true) process.exitCode = 2;
              } catch (_) {
                console.log("binance_contract_check=invalid_response");
                process.exitCode = 1;
              }
            });
          '
          REMOTE
